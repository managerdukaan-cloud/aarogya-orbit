<!doctype html><html lang="en"><head><title>AAROGYA ORBIT – Admin</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18251D"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="header"><div class="container"><a href="/dashboard.html"><img src="/assets/logo/logo-light.svg" alt="AAROGYA ORBIT"></a><div class="nav-actions"><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="hi" aria-pressed="false">हिं</button></div><button class="btn btn-ghost" id="logout" data-i18n="dash.logout"></button></div></div></header>
<nav class="subnav" aria-label="Admin"><div class="container"><a href="/admin-dashboard.html" data-i18n="ad.nav"></a><a href="/admin.html" aria-current="page" data-i18n="ad.reviews"></a><a href="/admin-tests.html" data-i18n="adm.catalogue"></a><a href="/admin-packages.html" data-i18n="pk.admin"></a><a href="/admin-payments.html" data-i18n="ad.payments"></a><a href="/admin-integrations.html" data-i18n="ig.nav"></a><a href="/admin-growth.html" data-i18n="gr.nav"></a><a href="/admin-ratings.html" data-i18n="ad.ratings"></a><a href="/admin-users.html" data-i18n="ad.users"></a><a href="/admin-requests.html" data-i18n="rq.nav"></a><a href="/admin-support.html" data-i18n="ad.support"></a><a href="/admin-audit.html" data-i18n="ad.audit"></a><a href="/admin-readiness.html" data-i18n="rd.nav"></a></div></nav>
<main class="container page" id="app" hidden style="max-width:860px">
<div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
<h2 class="sec" data-i18n="adm.pending"></h2>
<p class="notice" id="none" hidden data-i18n="adm.none"></p>
<div id="list" class="grid" style="grid-template-columns:1fr"></div>
<h2 class="sec" data-i18n="adm.pendingLabs"></h2>
<p class="notice" id="noneLab" hidden data-i18n="adm.noneLab"></p>
<div id="labList" class="grid" style="grid-template-columns:1fr"></div>
<h2 class="sec" data-i18n="adm.pendingHosp"></h2>
<p class="notice" id="noneHosp" hidden data-i18n="adm.noneHosp"></p>
<div id="hospList" class="grid" style="grid-template-columns:1fr"></div>
<h2 class="sec" data-i18n="adm.areas"></h2>
<section class="panel"><p class="mini" data-i18n="adm.areasNote"></p>
<div class="row" style="margin:10px 0"><input id="pin" type="text" inputmode="numeric" maxlength="6" data-i18n-ph="adm.pin" style="min-height:46px;border-radius:10px;border:0;padding:0 12px;background:var(--bg);box-shadow:var(--emboss-in);font:400 16px var(--font)"><input id="area" type="text" maxlength="60" data-i18n-ph="adm.areaName" style="min-height:46px;border-radius:10px;border:0;padding:0 12px;background:var(--bg);box-shadow:var(--emboss-in);font:400 16px var(--font)"><button class="btn btn-dark" id="addArea" data-i18n="adm.addArea"></button></div>
<div id="areaList"></div></section>
<h2 class="sec" data-i18n="adm.spec"></h2>
<section class="panel"><p id="specCount"></p><button class="btn btn-dark" id="seed" style="margin-top:12px" data-i18n="adm.seed"></button></section>
</main><script type="module" src="/js/admin.js"></script></body></html>
