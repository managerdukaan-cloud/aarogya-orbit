<!doctype html><html lang="en"><head><title>AAROGYA ORBIT – Packages</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18251D"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="header"><div class="container"><a href="/dashboard.html"><img src="/assets/logo/logo-light.svg" alt="AAROGYA ORBIT"></a><div class="nav-actions"><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="hi" aria-pressed="false">हिं</button></div><button class="btn btn-ghost" id="logout" data-i18n="dash.logout"></button></div></div></header>
<nav class="subnav" aria-label="Admin"><div class="container"><a href="/admin-dashboard.html" data-i18n="ad.nav"></a><a href="/admin.html" data-i18n="ad.reviews"></a><a href="/admin-tests.html" data-i18n="adm.catalogue"></a><a href="/admin-packages.html" aria-current="page" data-i18n="pk.admin"></a><a href="/admin-payments.html" data-i18n="ad.payments"></a><a href="/admin-ratings.html" data-i18n="ad.ratings"></a><a href="/admin-users.html" data-i18n="ad.users"></a><a href="/admin-support.html" data-i18n="ad.support"></a><a href="/admin-audit.html" data-i18n="ad.audit"></a></div></nav>
<main class="container page" id="app" hidden style="max-width:860px">
<h1 data-i18n="pk.admin"></h1><p class="sub" data-i18n="pk.adminSub"></p>
<div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
<button class="btn btn-primary" id="new" type="button" data-i18n="pk.new"></button>
<section class="panel" id="formWrap" hidden><form id="form" novalidate>
<div class="row2"><div class="field"><label for="name_en" data-i18n="cat.nameEn"></label><input id="name_en" type="text" maxlength="100"></div>
<div class="field"><label for="name_hi" data-i18n="cat.nameHi"></label><input id="name_hi" type="text" maxlength="100"></div></div>
<div class="field"><label for="description" data-i18n="cat.desc"></label><textarea id="description" maxlength="500"></textarea></div>
<p class="step" data-i18n="pk.includes"></p><div id="tests" style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:8px"></div>
<label class="check" style="margin-top:12px"><input type="checkbox" id="active" checked><span data-i18n="cat.active"></span></label>
<div class="btns"><button class="btn btn-primary" id="save" type="submit" data-i18n="fam.save"></button><button class="btn btn-ghost" id="cancel" type="button" data-i18n="fam.cancel"></button></div>
</form></section>
<p class="notice" id="empty" hidden style="margin-top:16px" data-i18n="pk.none"></p>
<div class="grid" id="list" style="grid-template-columns:1fr;margin-top:16px"></div>
</main><script type="module" src="/js/admin-packages.js"></script></body></html>
