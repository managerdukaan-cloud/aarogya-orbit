<!doctype html><html lang="en"><head><title>AAROGYA ORBIT – Reschedule</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18251D"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="header"><div class="container"><a href="/dashboard.html"><img src="/assets/logo/logo-light.svg" alt="AAROGYA ORBIT"></a><div class="nav-actions"><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="hi" aria-pressed="false">हिं</button></div><button class="btn btn-ghost" id="logout" data-i18n="dash.logout"></button></div></div></header>
<nav class="subnav" aria-label="Account"><div class="container"><a href="/dashboard.html" data-i18n="nav.home"></a><a href="/appointments.html" data-i18n="nav.appts"></a></div></nav>
<main class="container page" id="app" hidden>
<h1 data-i18n="rs.title"></h1><p class="sub" id="with"></p>
<p class="notice" id="blocked" hidden></p>
<section class="panel" id="formWrap"><div id="msg" class="msg" role="alert" aria-live="polite" hidden></div>
<p class="mini" id="current"></p>
<p class="step" data-i18n="bk.pickDate"></p><div class="chips" id="dates"></div>
<p class="step" data-i18n="bk.pickTime"></p><div class="chips" id="times"></div><p class="hint" id="noSlots" hidden data-i18n="bk.noSlots"></p>
<p class="notice" style="margin:18px 0" data-i18n="rs.note"></p>
<button class="btn btn-primary" id="confirm" type="button" disabled><span id="spin" class="loader" hidden></span><span data-i18n="rs.confirm"></span></button></section>
<section class="panel" id="done" hidden><div class="msg ok" data-i18n="rs.done"></div><a class="btn btn-primary" href="/appointments.html" data-i18n="bk.view"></a></section>
</main><script type="module" src="/js/reschedule.js"></script></body></html>
