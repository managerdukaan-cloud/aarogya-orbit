<main class="container page" id="app" hidden style="max-width:900px">
<h1 data-i18n="ad.payments"></h1>
<div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
<p class="notice" id="state"></p>
<h2 class="sec" data-i18n="pay.settings"></h2>
<section class="panel"><div class="row2"><div class="field"><label for="pct" data-i18n="pay.commission"></label><input id="pct" type="text" inputmode="decimal" maxlength="5"></div>
<div class="field"><label for="fee" data-i18n="pay.fixed"></label><input id="fee" type="text" inputmode="decimal" maxlength="6"></div></div>
<label class="check"><input type="checkbox" id="enabled"><span data-i18n="pay.enable"></span></label>
<button class="btn btn-primary" id="save" type="button" data-i18n="prof.save"></button></section>
<h2 class="sec" data-i18n="pay.summary"></h2>
<div class="grid" id="stats" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))"></div>
<h2 class="sec" data-i18n="pay.list"></h2>
<p class="notice" id="empty" hidden data-i18n="pay.none"></p>
<div class="grid" id="list" style="grid-template-columns:1fr"></div>
