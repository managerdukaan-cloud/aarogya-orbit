<!doctype html><html lang="en"><head><title>AAROGYA ORBIT – Help assistant</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18251D"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="header"><div class="container"><a href="/dashboard.html"><img src="/assets/logo/logo-light.svg" alt="AAROGYA ORBIT"></a><div class="nav-actions"><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="hi" aria-pressed="false">हिं</button></div><button class="btn btn-ghost" id="logout" data-i18n="dash.logout"></button></div></div></header>
<nav class="subnav" aria-label="Account"><div class="container"><a href="/dashboard.html" data-i18n="nav.home"></a><a href="/assistant.html" data-i18n="ai.title" aria-current="page"></a><a href="/support.html" data-i18n="nav.support"></a></div></nav>
<main class="container page" id="app" hidden>
<h1 data-i18n="ai.title"></h1><p class="sub" data-i18n="ai.sub"></p>
<p class="notice" data-i18n="notice.ai"></p>
<p class="notice" id="off" hidden style="margin-top:12px" data-i18n="ai.unavailable"></p>
<section class="panel" id="consentBox" hidden><h3 data-i18n="ai.consentTitle"></h3><p style="margin:8px 0" data-i18n="ai.consentText"></p>
<label class="check"><input type="checkbox" id="agree"><span data-i18n="ai.agree"></span></label><button class="btn btn-primary" id="accept" type="button" disabled data-i18n="ai.accept"></button></section>
<section class="panel" id="askBox" hidden><div id="msg" class="msg" role="alert" aria-live="polite" hidden></div>
<div class="field"><label for="q" data-i18n="ai.ask"></label><textarea id="q" maxlength="500"></textarea><div class="hint" data-i18n="ai.noPersonal"></div></div>
<button class="btn btn-primary" id="send" type="button"><span id="spin" class="loader" hidden></span><span data-i18n="ai.send"></span></button>
<div id="emergency" class="msg bad" hidden style="margin-top:14px" data-i18n="ai.emergency"></div>
<div id="answer" hidden style="margin-top:14px"><p id="answerText" style="white-space:pre-wrap"></p><p class="mini" style="margin-top:10px" data-i18n="ai.disclaimer"></p></div></section>
</main><script type="module" src="/js/assistant.js"></script></body></html>
