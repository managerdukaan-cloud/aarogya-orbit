<!doctype html><html lang="en"><head><title>AAROGYA ORBIT – Test catalogue</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18251D"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/auth.css"><link rel="stylesheet" href="/css/app.css"></head><body>
<header class="header"><div class="container"><a href="/dashboard.html"><img src="/assets/logo/logo-light.svg" alt="AAROGYA ORBIT"></a><div class="nav-actions"><div class="lang" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="hi" aria-pressed="false">हिं</button></div><button class="btn btn-ghost" id="logout" data-i18n="dash.logout"></button></div></div></header>
<nav class="subnav" aria-label="Admin"><div class="container"><a href="/admin-dashboard.html" data-i18n="ad.nav"></a><a href="/admin.html" data-i18n="ad.reviews"></a><a href="/admin-tests.html" data-i18n="adm.catalogue" aria-current="page"></a><a href="/admin-users.html" data-i18n="ad.users"></a><a href="/admin-support.html" data-i18n="ad.support"></a><a href="/admin-audit.html" data-i18n="ad.audit"></a></div></nav>
<main class="container page" id="app" hidden style="max-width:860px">
<h1 data-i18n="adm.catalogue"></h1><p class="sub" data-i18n="adm.catNote"></p>
<div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
<section class="panel"><p id="count"></p><div class="btns" style="margin-top:10px"><button class="btn btn-dark" id="seed" data-i18n="adm.seedTests"></button><button class="btn btn-primary" id="new" data-i18n="adm.newTest"></button></div></section>
<section class="panel" id="formWrap" hidden><form id="form" novalidate>
<div class="row2"><div class="field"><label for="name_en" data-i18n="cat.nameEn"></label><input id="name_en" type="text" maxlength="100"></div>
<div class="field"><label for="name_hi" data-i18n="cat.nameHi"></label><input id="name_hi" type="text" maxlength="100"></div></div>
<div class="field"><label for="category" data-i18n="cat.category"></label><select id="category"></select></div>
<div class="field"><label for="description" data-i18n="cat.desc"></label><textarea id="description" maxlength="500"></textarea></div>
<div class="row2"><div class="field"><label for="sampleType" data-i18n="cat.sample"></label><input id="sampleType" type="text" maxlength="60"></div>
<div class="field"><label for="fasting" data-i18n="cat.fasting"></label><input id="fasting" type="text" maxlength="80"></div></div>
<div class="field"><label for="preparation" data-i18n="cat.prep"></label><textarea id="preparation" maxlength="600"></textarea><div class="hint" data-i18n="cat.prepNote"></div></div>
<label class="check"><input type="checkbox" id="active" checked><span data-i18n="cat.active"></span></label>
<div class="btns"><button class="btn btn-primary" id="save" type="submit" data-i18n="fam.save"></button><button class="btn btn-ghost" id="cancel" type="button" data-i18n="fam.cancel"></button></div>
</form></section>
<div class="filters" style="grid-template-columns:minmax(0,320px)"><input id="q" type="search" data-i18n-ph="tt.search"></div>
<div class="grid" id="list" style="grid-template-columns:1fr"></div>
</main><script type="module" src="/js/admin-tests.js"></script></body></html>
